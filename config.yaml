# 教务问答 RAG 配置（全部可调参数集中在这里）

corpus:
  raw_dir: data/raw
  metadata: data/metadata.csv

chunk:
  max_chars: 400      # 单块字符上限
  overlap: 80         # 超长条款滑窗重叠
  min_chars: 40       # 低于此长度的碎片并入上一块

retrieval:
  bm25_topk: 20
  dense_topk: 20
  fusion: rrf         # rrf | none
  rrf_k: 60
  rerank_topk: 5
  rerank_model: BAAI/bge-reranker-v2-m3
  embedding_model: BAAI/bge-m3
  abstain_threshold: 0.35   # rerank 最高分低于此值则拒答

generation:
  model: deepseek-chat
  temperature: 0.1
  max_context_chunks: 5
  require_citation: true

eval:
  questions: eval/questions.jsonl
  ks: [1, 5, 10]
